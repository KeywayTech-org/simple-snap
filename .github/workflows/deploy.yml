name: CI/CD Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'Clear Render build cache'
        required: false
        default: false
        type: boolean

concurrency:
  group: render-deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (Lint)
        run: npm run lint

      - name: Build project
        run: npm run build

  deploy:
    name: Deploy to Render
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger & Monitor Render Deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          CLEAR_CACHE: ${{ github.event.inputs.clear_cache == true && 'clear' || 'do_not_clear' }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "${RENDER_API_KEY:-}" ] && [ -n "${RENDER_SERVICE_ID:-}" ]; then
            echo "🚀 Using Render REST API to deploy commit: ${COMMIT_SHA}"
            echo "🔧 Cache mode: ${CLEAR_CACHE}"

            DEPLOY_RES=$(curl -sS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"clearCache\":\"${CLEAR_CACHE}\",\"commitId\":\"${COMMIT_SHA}\"}")

            DEPLOY_ID=$(echo "${DEPLOY_RES}" | jq -r '.deploy.id // .id // empty')

            if [ -z "${DEPLOY_ID}" ]; then
              echo "❌ Failed to trigger deploy via Render API. Response:"
              echo "${DEPLOY_RES}"
              exit 1
            fi

            echo "✅ Deploy triggered successfully! Deploy ID: ${DEPLOY_ID}"
            echo "🔗 Dashboard URL: https://dashboard.render.com/web/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}"

            echo "⏳ Monitoring deploy status (timeout: 10 minutes)..."
            MAX_ATTEMPTS=40
            ATTEMPT=0

            while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              sleep 15
              ATTEMPT=$((ATTEMPT + 1))

              STATUS_RES=$(curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" \
                "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}")

              STATUS=$(echo "${STATUS_RES}" | jq -r '.status // .deploy.status // "unknown"')
              echo "[$ATTEMPT/$MAX_ATTEMPTS] Current status: ${STATUS}"

              case "${STATUS}" in
                "live")
                  echo "🎉 Deployment is LIVE! URL: https://simple-snap.onrender.com"
                  exit 0
                  ;;
                "build_failed"|"update_failed"|"canceled"|"deactivated")
                  echo "❌ Deployment ended with failure status: ${STATUS}"
                  exit 1
                  ;;
                *)
                  # in progress or queued
                  ;;
              esac
            done

            echo "⚠️ Deployment monitoring timed out after 10 minutes, but deploy was triggered."
            exit 1

          elif [ -n "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "🚀 Triggering deployment via Render Deploy Hook..."
            HOOK_URL="${RENDER_DEPLOY_HOOK_URL}&ref=${COMMIT_SHA}"
            RES=$(curl -sS -X POST "${HOOK_URL}")
            echo "Deploy hook response: ${RES}"
            echo "✅ Deploy hook called successfully."
          else
            echo "❌ Error: Neither RENDER_API_KEY + RENDER_SERVICE_ID nor RENDER_DEPLOY_HOOK_URL is configured in Secrets."
            exit 1
          fi
